<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="shield" x1="20" y1="12" x2="76" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>

  <!-- Shield body -->
  <path d="M48 14 L72 24 L72 50 C72 65 60 76 48 82 C36 76 24 65 24 50 L24 24 Z"
        fill="url(#shield)" opacity="0.9" filter="url(#glow)"/>

  <!-- Shield inner highlight -->
  <path d="M48 20 L66 28 L66 50 C66 62 56 72 48 76 C40 72 30 62 30 50 L30 28 Z"
        fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- Lock body -->
  <rect x="38" y="51" width="20" height="16" rx="4" fill="white" opacity="0.95"/>

  <!-- Lock shackle -->
  <path d="M42 51 L42 44 C42 40.7 45.3 38 48 38 C50.7 38 54 40.7 54 44 L54 51"
        stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- Keyhole dot -->
  <circle cx="48" cy="58" r="2.5" fill="#0B1220"/>
  <!-- Keyhole stem -->
  <rect x="47" y="58" width="2" height="4" rx="1" fill="#0B1220"/>
</svg>
